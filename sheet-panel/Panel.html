<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:14px/1.5 Arial,sans-serif;background:#f7f4ef;color:#252322;margin:0;padding:18px}h1{font-size:22px;line-height:1.2;margin:8px 0}label{display:block;font-size:12px;color:#5c5650;margin:18px 0 6px}select,input{box-sizing:border-box;width:100%;border:1px solid #d5cdc3;border-radius:12px;background:white;padding:12px;font:inherit}button,a{display:inline-block;border:0;border-radius:12px;padding:12px 16px;margin-top:14px;font:inherit;background:white;color:#252322}button.primary{background:#292521;color:white;width:100%}button:disabled{opacity:.45}p{margin:10px 0;color:#605a54;font-size:12px}.card{padding:16px;background:white;border-radius:18px;margin:18px 0}.price{font-size:27px;color:#252322;margin:4px 0}#status{min-height:36px}#local{background:#fbe8d6;padding:6px;border-radius:8px;font-size:11px}#check{display:none}</style></head><body><div id="local">LOCAL PREVIEW · NOT CONNECTED</div><h1>Price draft</h1><p>Shared with Admin. Publish is still required.</p><label for="service">Service</label><select id="service"><option value="">Choose a service</option></select><div id="editor" hidden><div class="card"><p id="name"></p><p class="price" id="current"></p><p id="version"></p></div><label for="price">New selling price (₹)</label><input id="price" inputmode="decimal" autocomplete="off"><p>Only this selling price changes. Costs, formulas and other saved drafts stay separate.</p><button id="save" class="primary" disabled>Save draft</button></div><p id="status" role="status">Choose a service to begin.</p><button id="check">Check status</button><p>Nothing is published from this panel. Review and Publish in Admin when ready.</p><script>
let view=null,busy=false,pending=null;
const $=id=>document.getElementById(id);
function show(message){$('status').textContent=message;}
function money(p){return '₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2});}
function price(){const v=$('price').value.trim();if(!/^\d+(\.\d{1,2})?$/.test(v))throw Error('Enter a price with up to two decimal places.');const parts=v.split('.'),n=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(n)||n<=0||n>100000000)throw Error('Enter a valid positive selling price.');return n;}
function render(v){view=v;$('editor').hidden=false;$('name').textContent=v.name;$('current').textContent=money(v.basePrice);$('version').textContent='Draft version '+v.version;$('price').value=String(v.basePrice/100);$('save').disabled=!v.editable||busy||!!pending;}
function request(data){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).panelRequest(data));}
function setBusy(b){busy=b;$('service').disabled=b||!!pending;$('price').disabled=b||!!pending;$('save').disabled=b||!!pending||!view?.editable;}
$('service').onchange=async()=>{if(busy||pending)return;view=null;$('editor').hidden=true;if(!$('service').value)return;setBusy(true);try{render(await request({operation:'read',serviceId:$('service').value}));show('Edit the draft price. Nothing is live.');}catch{show('Could not load the shared draft. No change made.');}finally{setBusy(false);}};
$('save').onclick=async()=>{if(busy||pending||!view)return;let next;try{next=price();}catch(e){show(e.message);return;}if(next===view.basePrice){show('No price change.');return;}const operationId='panel_'+crypto.randomUUID().replaceAll('-','');pending={operationId,serviceId:view.serviceId};try{sessionStorage.setItem('autodeck.panel.pending',JSON.stringify(pending));}catch{pending=null;show('Safe operation tracking is unavailable. Nothing saved.');return;}setBusy(true);try{const v=await request({operation:'save',operationId,serviceId:view.serviceId,draftId:view.draftId,version:view.version,sourceVersion:view.sourceVersion,basePrice:next});pending=null;sessionStorage.removeItem('autodeck.panel.pending');render(v);show('Draft saved. Review and Publish in Admin. Sheet cells and live prices are unchanged.');}catch{show('Save not confirmed. Check status before another edit.');$('check').style.display='inline-block';}finally{setBusy(false);}};
$('check').onclick=async()=>{if(busy||!pending)return;setBusy(true);try{const r=await request({operation:'status',operationId:pending.operationId});if(r.state==='saved'){pending=null;sessionStorage.removeItem('autodeck.panel.pending');render(r.view);$('check').style.display='none';show('Draft saved and confirmed. Publish is still required.');}else if(r.state==='not-started'){pending=null;sessionStorage.removeItem('autodeck.panel.pending');$('check').style.display='none';show('Save did not start. Reload the shared draft before editing again.');view=null;$('editor').hidden=true;$('service').value='';}else show('Not confirmed yet. Keep this operation for another status check.');}catch{show('Status unavailable. Do not repeat the save.');}finally{setBusy(false);}};
try{pending=JSON.parse(sessionStorage.getItem('autodeck.panel.pending')||'null');}catch{show('Operation tracking unavailable.');}
if(pending){$('check').style.display='inline-block';show('An earlier save needs a status check.');setBusy(false);}
google.script.run.withSuccessHandler(rows=>{for(const row of rows){const o=document.createElement('option');o.value=row.id;o.textContent=row.name;$('service').appendChild(o);}}).withFailureHandler(()=>show('Service list unavailable.')).panelServices();
</script></body></html>
