name: Prospective release tree QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prospective-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.head_ref == 'backup/customer-local-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: autodeck-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: autodeck-ci.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-app-id
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-recaptcha-site-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore release controls and prove exact transformed tree
        shell: bash
        run: |
          set -euo pipefail
          base=f853fb733b99eb8eb46888f36baa545a64cdad88
          expected=a5054555756d75e52586ebddad4ea8bf5c9a984b
          test "${{ github.event.pull_request.base.sha }}" = "$base"
          git restore --source "$base" --staged --worktree -- apps/admin/vercel.json apps/customer/vercel.json apps/site/vercel.json apps/studio/vercel.json scripts/vercel-ignore.sh .github/workflows/ci.yml
          git rm vercel.json .github/workflows/prospective-release.yml
          actual=$(git write-tree)
          test "$actual" = "$expected"
          echo "TRANSFORMED_RELEASE_TREE=$actual"
          echo "This qualifies a transformed tree, not ordinary PR-head or live acceptance."
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  emulator:
    if: github.head_ref == 'backup/customer-local-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Restore release controls and prove exact transformed tree
        shell: bash
        run: |
          set -euo pipefail
          base=f853fb733b99eb8eb46888f36baa545a64cdad88
          expected=a5054555756d75e52586ebddad4ea8bf5c9a984b
          test "${{ github.event.pull_request.base.sha }}" = "$base"
          git restore --source "$base" --staged --worktree -- apps/admin/vercel.json apps/customer/vercel.json apps/site/vercel.json apps/studio/vercel.json scripts/vercel-ignore.sh .github/workflows/ci.yml
          git rm vercel.json .github/workflows/prospective-release.yml
          actual=$(git write-tree)
          test "$actual" = "$expected"
          echo "TRANSFORMED_RELEASE_TREE=$actual"
          echo "This qualifies a transformed tree, not ordinary PR-head or live acceptance."
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mkdir -p /tmp/fbtools && cd /tmp/fbtools && npm init -y && npm install firebase-tools@13
      - name: Disposable emulator signing identity
        shell: bash
        run: |
          openssl genrsa -out /tmp/ci-sign-key.pem 2048
          echo "TEST_SIGN_CLIENT_EMAIL=ci-signer@demo-autodeck-ci.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "TEST_SIGN_PRIVATE_KEY<<EOF_KEY" >> "$GITHUB_ENV"
          cat /tmp/ci-sign-key.pem >> "$GITHUB_ENV"
          echo "EOF_KEY" >> "$GITHUB_ENV"
          rm /tmp/ci-sign-key.pem
      - run: /tmp/fbtools/node_modules/.bin/firebase emulators:exec --only auth,firestore,storage --project demo-autodeck-ci 'pnpm --filter functions test:emulator'
